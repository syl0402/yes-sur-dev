<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>골라 줘 결과 공유 이미지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 540px; height: 540px; box-sizing: border-box; background: #3157D5; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #FFFFFF; padding: 36px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="position: absolute; right: -80px; top: -90px; width: 260px; height: 260px; border-radius: 50%; background: #6F8BEB; opacity: .45"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 8px">
    <span style="background: #A3EA16; color: #202A40; font-size: 15px; font-weight: 900; padding: 6px 12px; border-radius: 999px">골라 줘</span>
    <span style="font-size: 15px; color: #E3E9FF">{{count}}명이 골랐어요</span>
  </div>
  <div style="position: relative; margin-top: 16px; font-size: 32px; font-weight: 900; line-height: 1.3; letter-spacing: -0.5px">{{q}}</div>

  <div style="position: relative; margin-top: 22px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <div style="position: relative; height: 50px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.14)">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{o.p}}%; background: {{o.fill}}"></div>
        <div style="position: relative; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 16px; color: {{o.fg}}">
          <span style="flex: 1; font-size: 18px; font-weight: {{o.w}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.label}}</span>
          <sc-if value="{{o.mine}}" hint-placeholder-val="{{false}}"><span style="background: #202A40; color: #A3EA16; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 999px">내 선택</span></sc-if>
          <sc-if value="{{o.top}}" hint-placeholder-val="{{false}}"><span style="background: #A3EA16; color: #202A40; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 999px">1위</span></sc-if>
          <span style="width: 48px; text-align: right; font-size: 18px; font-weight: 900">{{o.p}}%</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <div style="font-size: 26px; font-weight: 900">옛썰</div>
      <div style="margin-top: 2px; font-size: 14px; color: #E3E9FF">{{tagline}}</div>
    </div>
    <img src="/_blob/633b6551b24b5c3c7900d0e24b0b8eb4" alt="" style="width: 92px; height: auto; margin-bottom: -8px">
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"q":{"editor":"text","default":"종강 파티 메뉴 골라 줘"},"mine":{"editor":"number","default":2},"$preview":{"width":540,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props, mine = (p.mine ?? 2) - 1;
    var O = [['삼겹살', 12], ['치킨', 7], ['마라탕', 2], ['떡볶이', 1]];
    var total = O.reduce(function (s, o) { return s + o[1]; }, 0), max = Math.max.apply(null, O.map(function (o) { return o[1]; }));
    var opts = O.map(function (o, i) {
      var pct = Math.round(o[1] / total * 100), isMine = i === mine, top = o[1] === max;
      return { label: o[0], p: pct, mine: isMine, top: top, w: isMine || top ? 900 : 500,
        fill: top ? '#FFFFFF' : isMine ? '#C7D2FF' : 'rgba(255,255,255,.22)', fg: top || isMine ? '#202A40' : '#FFFFFF' };
    });
    var myTop = O[mine] && O[mine][1] === max;
    return { q: p.q ?? '종강 파티 메뉴 골라 줘', count: total, opts: opts,
      tagline: myTop ? '나도 1위 골랐어! 너는?' : '나만 다른 거 골랐나? 너는?' };
  }
}
</script>
</body>
</html>
