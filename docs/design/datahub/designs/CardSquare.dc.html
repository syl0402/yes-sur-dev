<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결과 카드 – 정사각 문항 카드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5}a:hover{color:#203A91}
</style>
</helmet>
<div style="width: 540px; height: 540px; box-sizing: border-box; background: #F1F4FF; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; overflow: hidden; padding: 40px 40px 32px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="background: #3157D5; color: #FFFFFF; font-size: 14px; font-weight: 900; padding: 6px 12px; border-radius: 999px">대학생 63명에게 물었어요</span>
    <span style="font-size: 22px; font-weight: 900; color: #3157D5">옛썰</span>
  </div>

  <div style="margin-top: 24px; font-size: 30px; font-weight: 900; line-height: 1.3; letter-spacing: -0.5px">학기 중에<br>아르바이트를 하나요?</div>

  <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 18px; font-weight: {{r.w}}">{{r.label}}</span>
          <span style="font-size: {{r.size}}px; font-weight: 900; color: {{r.tc}}">{{r.p}}%</span>
        </div>
        <div style="height: 18px; background: #FFFFFF; border-radius: 999px; overflow: hidden"><div style="height: 18px; width: {{r.p}}%; background: {{r.c}}; border-radius: 999px"></div></div>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="font-size: 13px; color: #545E73; line-height: 1.5">옛썰 데이터 허브<br>10.16~10.23 · 대학생 63명 응답</div>
    <img src="/_blob/82fd146deea0e556449337a9e4adae65" alt="옛썰 캐릭터" style="width: 92px; height: auto; margin-bottom: -6px">
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [['하고 있어요', 48], ['안 하지만 해 봤어요', 33], ['안 해 봤어요', 19]].map(function (r, i) {
      var top = i === 0;
      return { label: r[0], p: r[1], c: top ? '#3157D5' : '#C7D2FF', tc: top ? '#3157D5' : '#545E73', w: top ? 900 : 500, size: top ? 28 : 20 };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
