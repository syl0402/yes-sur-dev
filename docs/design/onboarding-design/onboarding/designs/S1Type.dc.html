<html lang="ko">
<head>

<title>회원가입 1 · 회원 종류</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#3157D5}
input::placeholder{color:#8B93A5}
.lb{display:block;margin:20px 0 8px;font-size:14px;color:#545E73}
.in{width:100%;height:56px;box-sizing:border-box;border:1px solid #E2E5EE;border-radius:16px;background:#FFFFFF;padding:0 18px;font-size:16px;font-family:inherit;color:#202A40;outline-color:#3157D5}
.opt{height:52px;border:1px solid #E2E5EE;border-radius:16px;background:#FFFFFF;font-family:inherit;font-size:16px;color:#202A40}
.on{border:2px solid #3157D5;background:#F1F4FF;color:#2949B5;font-weight:700}
.chip{height:44px;padding:0 18px;border:1px solid #E2E5EE;border-radius:999px;background:#FFFFFF;font-family:inherit;font-size:15px;color:#202A40}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.up1{animation:up .45s ease-out .05s both}.up2{animation:up .45s ease-out .15s both}.up3{animation:up .45s ease-out .25s both}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFCFC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 44px 16px 0; height: 108px; box-sizing: border-box; display: flex; align-items: center">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 10px rgba(32,42,64,.10); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 18px; font-weight: 900">회원가입</div>
    <div style="width: 48px"></div>
  </div>
  <div style="padding: 8px 24px 0; display: flex; align-items: center; gap: 6px"><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="margin-left: 8px; font-size: 15px; font-weight: 900; color: #545E73">1 / 6</span></div>
  <div class="up1" style="padding: 26px 24px 0"><div style="font-size: 25px; font-weight: 900; line-height: 1.35">어떤 회원으로 가입할까요?</div></div>
  <div style="padding: 22px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="2">
      <button onClick="{{t.pick}}" aria-pressed="{{t.sel}}" style="text-align: left; border: {{t.bd}}; background: {{t.bg}}; border-radius: 22px; padding: 22px; font-family: inherit; color: #202A40; display: flex; gap: 14px; align-items: flex-start">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; align-items: center; gap: 8px"><b style="font-size: 20px">{{t.name}}</b><sc-if value="{{t.hasTag}}" hint-placeholder-val="{{false}}"><span style="background: #F0F8D5; color: #506D23; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 999px">가입하면 500P</span></sc-if></span>
          <span style="font-size: 14px; color: #545E73; line-height: 1.5">{{t.desc}}</span>
        </span>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: auto; padding: 0 24px 34px"><a href="S2Terms.dc.html" style="height: 58px; border-radius: 18px; background: {{btnBg}}; color: {{btnFg}}; font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center">다음</a></div>
</div>
</x-dc>

</body>
</html>
