<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입 2 · 약관</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#3157D5}
input::placeholder{color:#8B93A5}
.lb{display:block;margin:20px 0 8px;font-size:14px;color:#545E73}
.in{width:100%;height:56px;box-sizing:border-box;border:1px solid #E2E5EE;border-radius:16px;background:#FFFFFF;padding:0 18px;font-size:16px;font-family:inherit;color:#202A40;outline-color:#3157D5}
.opt{height:52px;border:1px solid #E2E5EE;border-radius:16px;background:#FFFFFF;font-family:inherit;font-size:16px;color:#202A40}
.on{border:2px solid #3157D5;background:#F1F4FF;color:#2949B5;font-weight:700}
.chip{height:44px;padding:0 18px;border:1px solid #E2E5EE;border-radius:999px;background:#FFFFFF;font-family:inherit;font-size:15px;color:#202A40}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.up1{animation:up .45s ease-out .05s both}.up2{animation:up .45s ease-out .15s both}.up3{animation:up .45s ease-out .25s both}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFCFC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 44px 16px 0; height: 108px; box-sizing: border-box; display: flex; align-items: center">
    <a href="S1Type.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 10px rgba(32,42,64,.10); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 18px; font-weight: 900">회원가입</div>
    <div style="width: 48px"></div>
  </div>
  <div style="padding: 8px 24px 0; display: flex; align-items: center; gap: 6px"><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #E3E9FF"></span><span style="margin-left: 8px; font-size: 15px; font-weight: 900; color: #545E73">2 / 6</span></div>
  <div class="up1" style="padding: 26px 24px 0"><div style="font-size: 25px; font-weight: 900; line-height: 1.35">약관에 동의해 주세요</div></div>
  <div style="padding: 22px 24px 0">
    <button onClick="{{all}}" aria-pressed="{{allSel}}" style="width: 100%; height: 64px; border: 1px solid {{allBd}}; border-radius: 18px; background: {{allBg}}; font-family: inherit; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #202A40">
      <span style="width: 28px; height: 28px; border-radius: 9px; background: {{allBox}}; border: 2px solid {{allBoxBd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
      <b style="font-size: 17px">전체 동의</b>
    </button>
    <div style="margin-top: 8px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 6px 0 18px">
          <button onClick="{{it.pick}}" aria-pressed="{{it.sel}}" aria-label="{{it.label}}" style="width: 44px; height: 44px; margin-left: -8px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 8px; background: {{it.box}}; border: 2px solid {{it.boxBd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
          <span style="flex: 1; font-size: 15px">{{it.label}}</span>
          <a href="#" style="font-size: 13px; color: #545E73; text-decoration: underline">보기</a>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="margin-top: auto; padding: 0 24px 34px"><a href="S3Email.dc.html" style="height: 58px; border-radius: 18px; background: {{btnBg}}; color: {{btnFg}}; font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center">다음</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: [false, false, false, false] }; }
  renderVals() {
    var self = this, c = this.state.c, all = c.every(function (x) { return x; });
    var L = ['[필수] 만 14세 이상이에요', '[필수] 이용약관 동의', '[필수] 개인정보 수집·이용 동의', '[필수] 응답 결과의 통계 공개 동의'];
    function box(on) { return on ? ['#3157D5', '#3157D5'] : ['#FFFFFF', '#CDD2DF']; }
    return {
      allSel: all ? 'true' : 'false', allBd: all ? '#3157D5' : '#E2E5EE', allBg: all ? '#F1F4FF' : '#FFFFFF', allBox: box(all)[0], allBoxBd: box(all)[1],
      all: function () { var v = !all; self.setState({ c: [v, v, v, v] }); },
      btnBg: all ? '#3157D5' : '#EFF1F7', btnFg: all ? '#FFFFFF' : '#545E73',
      items: L.map(function (l, i) { return { label: l, sel: c[i] ? 'true' : 'false', box: box(c[i])[0], boxBd: box(c[i])[1], pick: function () { var n = c.slice(); n[i] = !n[i]; self.setState({ c: n }); } }; })
    };
  }
}
</script>
</body>
</html>
