<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입 6 · 나에 대해</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#3157D5}
input::placeholder{color:#8B93A5}
.lb{display:block;margin:20px 0 8px;font-size:14px;color:#545E73}
.in{width:100%;height:56px;box-sizing:border-box;border:1px solid #E2E5EE;border-radius:16px;background:#FFFFFF;padding:0 18px;font-size:16px;font-family:inherit;color:#202A40;outline-color:#3157D5}
.opt{height:52px;border:1px solid #E2E5EE;border-radius:16px;background:#FFFFFF;font-family:inherit;font-size:16px;color:#202A40}
.on{border:2px solid #3157D5;background:#F1F4FF;color:#2949B5;font-weight:700}
.chip{height:44px;padding:0 18px;border:1px solid #E2E5EE;border-radius:999px;background:#FFFFFF;font-family:inherit;font-size:15px;color:#202A40}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.up1{animation:up .45s ease-out .05s both}.up2{animation:up .45s ease-out .15s both}.up3{animation:up .45s ease-out .25s both}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #FCFCFC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 44px 16px 0; height: 108px; box-sizing: border-box; display: flex; align-items: center">
    <a href="S5Account.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 10px rgba(32,42,64,.10); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 18px; font-weight: 900">회원가입</div>
    <div style="width: 48px"></div>
  </div>
  <div style="padding: 8px 24px 0; display: flex; align-items: center; gap: 6px"><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="flex: 1; height: 6px; border-radius: 999px; background: #3157D5"></span><span style="margin-left: 8px; font-size: 15px; font-weight: 900; color: #545E73">6 / 6</span></div>
  <div class="up1" style="padding: 26px 24px 0"><div style="font-size: 25px; font-weight: 900; line-height: 1.35">나에 대해 알려 주세요</div></div>
  <div style="margin: 14px 24px 0; background: #F1F4FF; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3157D5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span style="font-size: 13px; color: #2949B5; line-height: 1.5">나한테 맞는 설문을 보내고, 결과를 '20대 초반 여성 58%'처럼 묶어 볼 때만 써요. 다른 사람에게 내 정보는 보이지 않아요.</span>
  </div>
  <div style="padding: 0 24px">
    <span class="lb">전공 계열</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{majors}}" as="m" hint-placeholder-count="7"><button onClick="{{m.pick}}" aria-pressed="{{m.sel}}" class="chip" style="border-color: {{m.bd}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">{{m.label}}</button></sc-for>
    </div>
    <span class="lb">과정</span>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><button class="opt on">학부</button><button class="opt">대학원</button></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <div><label class="lb" for="yr">입학년도</label><button id="yr" class="opt" style="width: 100%; text-align: left; padding: 0 16px; display: flex; justify-content: space-between; align-items: center">2022년 <span style="color: #8B93A5">▾</span></button></div>
      <div><label class="lb" for="by">출생연도</label><button id="by" class="opt" style="width: 100%; text-align: left; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; color: #8B93A5">선택 <span>▾</span></button></div>
    </div>
    <span class="lb">성별</span>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px"><button class="opt">남성</button><button class="opt on">여성</button><button class="opt">선택 안 함</button></div>
  </div>
  <div style="margin-top: auto; padding: 24px 24px 34px"><a href="SignupGuide.dc.html" style="height: 58px; border-radius: 18px; background: #3157D5; color: #FFFFFF; font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center">가입 완료</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 1 }; }
  renderVals() {
    var self = this, st = this.state;
    return { majors: ['인문', '사회', '교육', '공학', '자연', '의약', '예체능'].map(function (l, i) { var on = st.m === i; return { label: l, sel: on ? 'true' : 'false', bd: on ? '#3157D5' : '#E2E5EE', bg: on ? '#F1F4FF' : '#FFFFFF', fg: on ? '#2949B5' : '#202A40', fw: on ? 700 : 400, pick: function () { self.setState({ m: i }); } }; }) };
  }
}
</script>
</body>
</html>
