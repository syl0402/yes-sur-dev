<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>포인트 내역</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5;text-decoration:none}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #FCFCFC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; padding-top: 44px; position: relative; overflow: hidden">

  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 700">포인트 내역</div>
    <div style="width: 44px"></div>
  </div>

  <div style="margin: 8px 16px 0; background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 2px 10px rgba(32,42,64,0.04); border-radius: 20px; padding: 18px 18px 16px">
    <div style="font-size: 13px; color: #545E73">지금 내 포인트</div>
    <div style="margin-top: 2px; font-size: 30px; font-weight: 900; letter-spacing: -0.5px">257P</div>
    <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <div style="background: #F1F4FF; border-radius: 12px; padding: 10px 12px"><div style="font-size: 12px; color: #545E73">이번 달 모은</div><b style="font-size: 16px; color: #2949B5">+270P</b></div>
      <div style="background: #F7F8FC; border-radius: 12px; padding: 10px 12px"><div style="font-size: 12px; color: #545E73">이번 달 쓴</div><b style="font-size: 16px">-150P</b></div>
    </div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; gap: 6px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
      <button onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 14px; font-weight: 700">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div>
        <div style="margin: 0 4px 6px; font-size: 13px; font-weight: 700; color: #545E73">{{g.day}}</div>
        <div style="background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 2px 10px rgba(32,42,64,0.04); border-radius: 18px; padding: 0 16px">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: {{r.line}}">
              <span style="width: 34px; height: 34px; border-radius: 12px; background: {{r.iconBg}}; color: {{r.iconFg}}; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.icon}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                <span style="font-size: 12px; color: #545E73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
              </span>
              <b style="font-size: 15px; color: {{r.color}}">{{r.amt}}</b>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <a href="#" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 48px; border-radius: 14px; background: #E3E9FF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">포인트는 어떻게 모으나요?</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all' }; }
  renderVals() {
    var self = this, st = this.state;
    var D = [
      ['11월 12일', [
        ['응답', '설문 응답', 'ㅇㄴ · 22:24', 10],
        ['응답', '설문 응답', 'ㅇㅁㄹㄹ · 22:14', 10],
        ['응답', '설문 응답', '대학생 자취생/기숙사생 식습관 · 22:14', 30],
        ['환불', '설문 삭제 환불', '못 받은 10명분 돌려받음 · 20:22', 150],
        ['등록', '설문 등록', '목표 10명 × 15P · 20:21', -150],
        ['미션', '웰컴 미션 3일차', '커뮤니티 투표하기 · 15:49', 30]
      ]],
      ['11월 11일', [
        ['응답', '설문 응답', '태그 test · 20:19', 10],
        ['연속', '오늘의 질문 7일 연속', '보너스 · 02:01', 20]
      ]]
    ];
    var groups = [];
    D.forEach(function (g) {
      var rows = g[1].filter(function (r) { return st.f === 'all' || (st.f === 'in' ? r[3] > 0 : r[3] < 0); });
      if (!rows.length) return;
      groups.push({ day: g[0], rows: rows.map(function (r, i) {
        var plus = r[3] > 0;
        return { icon: r[0], title: r[1], sub: r[2], amt: (plus ? '+' : '') + r[3] + 'P', color: plus ? '#2949B5' : '#202A40',
          iconBg: plus ? '#F1F4FF' : '#EFF1F7', iconFg: plus ? '#2949B5' : '#545E73', line: i ? '1px solid #EFF1F7' : 'none' };
      }) });
    });
    var filters = [['all', '전체'], ['in', '모은'], ['out', '쓴']].map(function (f) {
      var on = st.f === f[0];
      return { label: f[1], bg: on ? '#202A40' : '#FFFFFF', fg: on ? '#FFFFFF' : '#374158', bd: on ? '#202A40' : '#E2E5EE', pick: function () { self.setState({ f: f[0] }); } };
    });
    return { filters: filters, groups: groups };
  }
}
</script>
</body>
</html>
