<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>의견 보내기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5;text-decoration:none}
textarea::placeholder{color:#8B93A5}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #FCFCFC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; padding-top: 44px; position: relative; overflow: hidden">

  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 700">의견 보내기</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 6px 20px 0; font-size: 15px; color: #545E73; line-height: 1.5">불편한 점, 오류, 바라는 기능을 알려 주세요. 더 나은 옛썰을 만드는 데 큰 힘이 돼요.</div>

  <div style="margin: 18px 20px 8px; font-size: 14px; font-weight: 700">어떤 이야기인가요?</div>
  <div style="margin: 0 20px; display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
      <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 700">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="margin: 18px 20px 8px; font-size: 14px; font-weight: 700">내용</div>
  <div style="margin: 0 16px">
    <label for="fb" style="position: absolute; width: 1px; height: 1px; overflow: hidden">내용</label>
    <textarea id="fb" placeholder="{{ph}}" style="width: 100%; height: 140px; box-sizing: border-box; border: 1px solid #E2E5EE; border-radius: 16px; background: #FFFFFF; padding: 14px 16px; font-size: 15px; font-family: inherit; resize: none; outline-color: #3157D5"></textarea>
    <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center">
      <button style="height: 40px; padding: 0 12px; border: 1px dashed #CDD2DF; border-radius: 12px; background: #FFFFFF; color: #374158; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#374158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-8 7"></path></svg>화면 캡처 첨부</button>
      <span style="font-size: 12px; color: #545E73">0 / 1000</span>
    </div>
    <div style="margin-top: 8px; font-size: 12px; color: #545E73; line-height: 1.5">오류를 고치려고 기기 종류·앱 버전만 함께 보내요. 이름·연락처는 보내지 않아요.</div>
  </div>

  <div style="margin: 16px 16px 0"><button disabled style="width: 100%; height: 54px; border: none; border-radius: 16px; background: #EFF1F7; color: #545E73; font-family: inherit; font-size: 15px; font-weight: 700">내용을 써 주세요</button></div>

  <div style="margin: 28px 20px 8px; font-size: 14px; font-weight: 700">내가 보낸 의견</div>
  <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 2px 10px rgba(32,42,64,0.04); border-radius: 16px; padding: 14px 16px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #545E73"><span>불편해요 · 10.31</span><span style="background: #F0F8D5; color: #506D23; font-weight: 700; padding: 2px 8px; border-radius: 999px">반영 완료</span></div>
      <div style="margin-top: 6px; font-size: 15px">불편테스트</div>
      <div style="margin-top: 10px; background: #F1F4FF; border-radius: 12px; padding: 10px 12px"><b style="font-size: 12px; color: #2949B5">옛썰 답변</b><div style="margin-top: 2px; font-size: 14px">반영했어요. 알려 줘서 고마워요!</div></div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #ECEEF3; box-shadow: 0 2px 10px rgba(32,42,64,0.04); border-radius: 16px; padding: 14px 16px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #545E73"><span>불편해요 · 10.30</span><span style="background: #E3E9FF; color: #2949B5; font-weight: 700; padding: 2px 8px; border-radius: 999px">답변 완료</span></div>
      <div style="margin-top: 6px; font-size: 15px">...</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var T = ['버그·오류', '불편해요', '바라는 기능', '기타'];
    var PH = ['예: 설문 응답 화면에서 [다음]을 눌러도 안 넘어가요', '예: 포인트 내역에서 무슨 포인트인지 모르겠어요', '예: 설문에 사진 보기가 있으면 좋겠어요', '자유롭게 적어 주세요'];
    return {
      ph: PH[st.t],
      types: T.map(function (l, i) {
        var on = st.t === i;
        return { label: l, on: on ? 'true' : 'false', bg: on ? '#3157D5' : '#FFFFFF', fg: on ? '#FFFFFF' : '#374158', bd: on ? '#3157D5' : '#E2E5EE', pick: function () { self.setState({ t: i }); } };
      })
    };
  }
}
</script>
</body>
</html>
