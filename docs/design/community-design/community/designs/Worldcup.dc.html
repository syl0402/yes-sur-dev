<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>월드컵 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5}a:hover{color:#203A91}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{transform-origin:bottom;animation:rise .55s cubic-bezier(.34,1.4,.64,1) both}
.r3{animation-delay:.1s}.r2{animation-delay:.35s}.r1{animation-delay:.65s}
.lbl{animation:fadeIn .3s ease-out both}
.l3{animation-delay:.5s}.l2{animation-delay:.75s}.l1{animation-delay:1.1s}
.trophy{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) 1.25s both}
.bar{transform-origin:left;animation:fill .6s ease-out both}
.rows>div:nth-child(1) .bar{animation-delay:1.3s}.rows>div:nth-child(2) .bar{animation-delay:1.38s}.rows>div:nth-child(3) .bar{animation-delay:1.46s}.rows>div:nth-child(4) .bar{animation-delay:1.54s}.rows>div:nth-child(5) .bar{animation-delay:1.62s}.rows>div:nth-child(6) .bar{animation-delay:1.7s}.rows>div:nth-child(7) .bar{animation-delay:1.78s}.rows>div:nth-child(8) .bar{animation-delay:1.86s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1300px; box-sizing: border-box; background: #FFFFFF; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; padding-top: 44px; overflow: hidden">

  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 700">월드컵 결과</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 8px 20px 0">
    <span style="background: #FEF6E7; color: #93370D; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px">16강 · 4명 참여</span>
    <h1 style="margin: 12px 0 0; font-size: 22px; font-weight: 900">시험 끝나면 제일 먼저 하고 싶은 것</h1>
  </div>

  <div style="margin: 20px 16px 0; background: #3157D5; border-radius: 24px; padding: 22px 16px 0; color: #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; overflow: hidden">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span class="lbl l2" style="font-size: 14px; font-weight: 700; text-align: center">방 대청소</span>
      <span class="lbl l2" style="font-size: 11px; color: #C7D2FF">승률 67%</span>
      <div class="rise r2" style="width: 100%; height: 70px; background: #2949B5; border-radius: 12px 12px 0 0; display: flex; justify-content: center; padding-top: 8px; box-sizing: border-box; font-size: 22px; font-weight: 900">2</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <svg class="trophy" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A3EA16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>
      <span class="lbl l1" style="font-size: 16px; font-weight: 900; text-align: center">하루 종일 잠자기</span>
      <span class="lbl l1" style="font-size: 11px; color: #C7D2FF">승률 75%</span>
      <div class="rise r1" style="width: 100%; height: 100px; background: #A3EA16; color: #202A40; border-radius: 12px 12px 0 0; display: flex; justify-content: center; padding-top: 8px; box-sizing: border-box; font-size: 26px; font-weight: 900">1</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span class="lbl l3" style="font-size: 14px; font-weight: 700">게임</span>
      <span class="lbl l3" style="font-size: 11px; color: #C7D2FF">승률 63%</span>
      <div class="rise r3" style="width: 100%; height: 52px; background: #2949B5; border-radius: 12px 12px 0 0; display: flex; justify-content: center; padding-top: 8px; box-sizing: border-box; font-size: 20px; font-weight: 900">3</div>
    </div>
  </div>

  <div style="margin: 24px 20px 0; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 16px; font-weight: 900">전체 순위</span>
    <span style="font-size: 12px; color: #545E73">1:1 승률 = 맞붙었을 때 이긴 비율</span>
  </div>
  <div class="rows" style="margin: 8px 20px 0">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #EFF1F7">
        <span style="width: 20px; font-size: 14px; font-weight: 900; color: #8B93A5">{{r.rank}}</span>
        <span style="width: 108px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span>
        <div style="flex: 1; height: 8px; background: #EFF1F7; border-radius: 999px; overflow: hidden"><div class="bar" style="height: 8px; width: {{r.p}}%; background: #C7D2FF; border-radius: 999px"></div></div>
        <span style="width: 36px; text-align: right; font-size: 13px; font-weight: 700">{{r.p}}%</span>
      </div>
    </sc-for>
    <button style="margin-top: 6px; height: 40px; border: none; background: transparent; color: #3157D5; font-size: 13px; font-weight: 700; font-family: inherit; padding: 0">16위까지 모두 보기</button>
  </div>

  <div style="margin: 18px 20px 0; font-size: 16px; font-weight: 900">그룹별 1위</div>
  <div style="margin: 10px 16px 0; background: #F7F8FC; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
    <div style="display: flex; justify-content: space-between"><span style="color: #545E73">여성</span><b>게임</b></div>
    <div style="display: flex; justify-content: space-between"><span style="color: #545E73">사회 계열</span><b>게임</b></div>
    <div style="font-size: 12px; color: #545E73">참여자가 10명 넘는 그룹부터 보여요 (지금은 예시)</div>
  </div>

  <a href="#" style="margin: 16px 20px 0; min-height: 50px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #EFF1F7; border-bottom: 1px solid #EFF1F7; text-decoration: none; color: #202A40">
    <span style="font-size: 15px; font-weight: 700">댓글 3 <span style="font-weight: 400; color: #545E73; font-size: 14px">· 치킨?</span></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB5C5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EFF1F7; padding: 12px 16px 30px; display: flex; gap: 10px">
    <button style="flex: 1; height: 56px; border: 1px solid #E2E5EE; border-radius: 16px; background: #FFFFFF; color: #374158; font-size: 15px; font-weight: 700; font-family: inherit">다시 하기</button>
    <button style="flex: 1; height: 56px; border: none; border-radius: 16px; background: #3157D5; color: #FFFFFF; font-size: 15px; font-weight: 700; font-family: inherit">결과 공유</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 104px; text-align: center; font-size: 12px; color: #545E73">다시 하기는 결과에 반영되지 않아요</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [['친구랑 술 한잔', 57], ['드라마 몰아보기', 60], ['영화관', 60], ['노래방', 50], ['PC방', 50], ['맛집 탐방', 50], ['한강 산책', 50], ['여행 가기', 33]]
      .map(function (r, i) { return { rank: i + 4, label: r[0], p: r[1] }; });
    return { rows: rows };
  }
}
</script>
</body>
</html>
