<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>밸런스 투표 C안 – 줄다리기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5}a:hover{color:#203A91}
@keyframes pop{0%{opacity:0;transform:scale(.3)}65%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}20%{transform:translate(-50%,-50%) rotate(-12deg)}40%{transform:translate(-50%,-50%) rotate(10deg)}60%{transform:translate(-50%,-50%) rotate(-6deg)}80%{transform:translate(-50%,-50%) rotate(4deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.half{transition:width .9s cubic-bezier(.34,1.4,.64,1)}
.seam{transition:left .9s cubic-bezier(.34,1.4,.64,1)}
.shake{animation:shake .6s ease-in-out .9s both}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) .6s both}
.fadeup{animation:fadeUp .35s ease-out 1s both}
.side{transition:filter .15s ease}.side:active{filter:brightness(.92)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 640px; box-sizing: border-box; background: #F7F8FC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; padding: 20px 16px">
  <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 16px 18px; box-shadow: 0 2px 10px rgba(32,42,64,0.05)">
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="background: #E3E9FF; color: #2949B5; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px">밸런스</span>
      <span style="font-size: 12px; color: #545E73">옛썰 공식 · 11.9</span>
    </div>
    <div style="margin-top: 10px; font-size: 18px; font-weight: 900">통학, 어느 파야?</div>

    <div style="margin-top: 16px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 900">
      <span style="color: #3157D5">광역버스파</span><span style="color: #506D23">지옥철파</span>
    </div>

    <div style="position: relative; margin-top: 8px; height: 168px; border-radius: 24px; overflow: hidden; display: flex">
      <button class="half side" onClick="{{pickA}}" aria-label="광역버스파 고르기" style="width: {{wA}}%; border: none; background: #3157D5; color: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 18px; box-sizing: border-box; overflow: hidden; white-space: nowrap">
        <sc-if value="{{voted}}" hint-placeholder-val="{{false}}"><span class="pop" style="font-size: 34px; font-weight: 900; letter-spacing: -1px">{{pA}}%</span></sc-if>
        <span style="font-size: 17px; font-weight: 900">광역버스</span>
        <span style="font-size: 11px; color: #C7D2FF">왕복 3시간 · 앉아서</span>
        <sc-if value="{{mineA}}" hint-placeholder-val="{{false}}"><span class="pop" style="margin-top: 4px; background: #A3EA16; color: #202A40; font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 999px">내 선택</span></sc-if>
      </button>
      <button class="side" onClick="{{pickB}}" aria-label="지옥철파 고르기" style="flex: 1; border: none; background: #A3EA16; color: #202A40; font-family: inherit; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 18px; box-sizing: border-box; overflow: hidden; white-space: nowrap">
        <sc-if value="{{voted}}" hint-placeholder-val="{{false}}"><span class="pop" style="font-size: 34px; font-weight: 900; letter-spacing: -1px">{{pB}}%</span></sc-if>
        <span style="font-size: 17px; font-weight: 900">지옥철</span>
        <span style="font-size: 11px; color: #506D23">1시간 30분 · 서서</span>
        <sc-if value="{{mineB}}" hint-placeholder-val="{{false}}"><span class="pop" style="margin-top: 4px; background: #3157D5; color: #FFFFFF; font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 999px">내 선택</span></sc-if>
      </button>
      <span class="seam" style="position: absolute; top: 0; bottom: 0; left: {{wA}}%; width: 4px; margin-left: -2px; background: #FFFFFF; pointer-events: none"></span>
      <sc-if value="{{voted}}" hint-placeholder-val="{{false}}">
        <span class="seam shake" style="position: absolute; top: 50%; left: {{wA}}%; transform: translate(-50%,-50%); width: 46px; height: 46px; border-radius: 50%; background: #202A40; border: 4px solid #FFFFFF; color: #A3EA16; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; pointer-events: none">VS</span>
      </sc-if>
      <sc-if value="{{notVoted}}" hint-placeholder-val="{{true}}">
        <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; border-radius: 50%; background: #202A40; border: 4px solid #FFFFFF; color: #A3EA16; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; pointer-events: none">VS</span>
      </sc-if>
    </div>

    <sc-if value="{{notVoted}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 12px; text-align: center; font-size: 14px; color: #545E73">내 편을 눌러서 끌어당겨요</div>
    </sc-if>
    <sc-if value="{{voted}}" hint-placeholder-val="{{false}}">
      <div class="fadeup" style="margin-top: 12px; text-align: center; font-size: 14px; font-weight: 700; color: {{leadColor}}">{{leadText}}</div>
    </sc-if>

    <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; color: #545E73">{{count}}명 참여 · 댓글 12</span>
      <sc-if value="{{voted}}" hint-placeholder-val="{{false}}"><button onClick="{{reset}}" style="height: 32px; border: none; background: transparent; color: #3157D5; font-size: 13px; font-weight: 700; font-family: inherit">다시 해보기</button></sc-if>
    </div>
  </div>
  <div style="margin-top: 14px; font-size: 13px; color: #545E73; line-height: 1.6; padding: 0 4px">
    <b style="color: #202A40">C안 · 줄다리기</b><br>양쪽을 '○○파'로 편을 나눠요. 내 편을 누르면 경계선이 표가 많은 쪽으로 '쭉' 밀리고, 가운데 VS가 흔들려요.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: null }; }
  renderVals() {
    var self = this, st = this.state;
    var base = [28, 20], c = base.map(function (v, i) { return v + (st.pick === i ? 1 : 0); });
    var total = c[0] + c[1], pA = Math.round(c[0] / total * 100), pB = 100 - pA;
    var voted = st.pick !== null;
    var wA = voted ? Math.max(28, Math.min(72, pA)) : 50;
    var gap = Math.abs(pA - pB), winA = pA >= pB;
    return {
      voted: voted, notVoted: !voted, pA: pA, pB: pB, wA: wA, count: total,
      mineA: st.pick === 0, mineB: st.pick === 1,
      leadText: (winA ? '광역버스파' : '지옥철파') + '가 ' + gap + '%p 앞서는 중!',
      leadColor: winA ? '#3157D5' : '#506D23',
      pickA: function () { if (self.state.pick === null) self.setState({ pick: 0 }); },
      pickB: function () { if (self.state.pick === null) self.setState({ pick: 1 }); },
      reset: function () { self.setState({ pick: null }); }
    };
  }
}
</script>
</body>
</html>
