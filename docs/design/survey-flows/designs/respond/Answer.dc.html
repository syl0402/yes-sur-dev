<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설문 응답</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5}a:hover{color:#203A91}
@keyframes qIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes check{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.qin{animation:qIn .3s ease-out both}
.dim{animation:dimIn .2s ease-out both}
.popin{animation:popIn .25s cubic-bezier(.2,.9,.3,1.2) both}
.check{animation:check .25s ease-out both}
.opt{transition:transform .12s ease}.opt:active{transform:scale(.97)}
.seg{transition:background-color .3s ease}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F8FC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; padding-top: 44px; overflow: hidden">

  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px; gap: 4px">
    <button onClick="{{askExit}}" aria-label="설문 나가기" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">시험 기간 카페 이용 설문조사</div>
    <span style="background: #F0F8D5; color: #506D23; font-size: 13px; font-weight: 900; padding: 5px 10px; border-radius: 999px; margin-right: 10px; flex-shrink: 0">+10P</span>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="3">
        <div class="seg" style="height: 6px; border-radius: 999px; background: {{s.color}}"></div>
      </sc-for>
    </div>
    <span style="font-size: 13px; font-weight: 700; color: #545E73"><b style="color: #3157D5">{{num}}</b> / 3</span>
  </div>

  <sc-for list="{{qs}}" as="q" hint-placeholder-count="1">
    <sc-if value="{{q.current}}" hint-placeholder-val="{{true}}">
      <div class="qin" style="padding: 36px 20px 0">
        <div style="font-size: 14px; font-weight: 900; color: #3157D5">Q{{q.n}}</div>
        <h1 style="margin: 8px 0 0; font-size: 23px; font-weight: 900; line-height: 1.35; letter-spacing: -0.4px">{{q.title}}</h1>
        <p style="margin: 8px 0 0; font-size: 14px; color: #545E73">{{q.hint}}</p>

        <sc-if value="{{q.isChoice}}" hint-placeholder-val="{{true}}">
          <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{q.options}}" as="o" hint-placeholder-count="4">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}">
                <button class="opt" onClick="{{o.pick}}" style="height: 58px; box-sizing: border-box; border: 2px solid #3157D5; background: #F1F4FF; border-radius: 16px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 16px; font-weight: 700; color: #2949B5">
                  {{o.label}}
                  <span class="check" style="width: 24px; height: 24px; border-radius: 50%; background: #3157D5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
                </button>
              </sc-if>
              <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}">
                <button class="opt" onClick="{{o.pick}}" style="height: 58px; box-sizing: border-box; border: 1px solid #E2E5EE; background: #FFFFFF; border-radius: 16px; padding: 0 17px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 16px; font-weight: 500; color: #202A40">
                  {{o.label}}
                  <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #CDD2DF"></span>
                </button>
              </sc-if>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{q.isScale}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{q.options}}" as="o" hint-placeholder-count="5">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}">
                <button class="opt" onClick="{{o.pick}}" aria-label="{{o.aria}}" style="height: 60px; border: none; background: #3157D5; color: #FFFFFF; border-radius: 16px; font-family: inherit; font-size: 19px; font-weight: 900">{{o.label}}</button>
              </sc-if>
              <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}">
                <button class="opt" onClick="{{o.pick}}" aria-label="{{o.aria}}" style="height: 60px; box-sizing: border-box; border: 1px solid #E2E5EE; background: #FFFFFF; color: #202A40; border-radius: 16px; font-family: inherit; font-size: 19px; font-weight: 700">{{o.label}}</button>
              </sc-if>
            </sc-for>
          </div>
          <div style="margin-top: 10px; display: flex; justify-content: space-between; font-size: 13px; color: #545E73">
            <span>전혀 아니에요</span><span>보통</span><span>매우 그래요</span>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </sc-for>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E2E5EE; padding: 12px 16px 30px; display: flex; gap: 10px">
    <sc-if value="{{hasPrev}}" hint-placeholder-val="{{false}}">
      <button onClick="{{prev}}" style="width: 104px; height: 56px; box-sizing: border-box; border: 1px solid #E2E5EE; background: #FFFFFF; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 700; color: #545E73; flex-shrink: 0">이전</button>
    </sc-if>
    <sc-if value="{{canNext}}" hint-placeholder-val="{{false}}">
      <button onClick="{{next}}" style="flex: 1; height: 56px; border: none; background: #3157D5; border-radius: 16px; font-family: inherit; font-size: 17px; font-weight: 700; color: #FFFFFF">다음</button>
    </sc-if>
    <sc-if value="{{canSubmit}}" hint-placeholder-val="{{false}}">
      <a href="Complete.dc.html" style="flex: 1; height: 56px; background: #3157D5; border-radius: 16px; font-size: 17px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">제출하고 10P 받기</a>
    </sc-if>
    <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
      <button disabled style="flex: 1; height: 56px; border: none; background: #E2E5EE; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 700; color: #545E73">{{waitLabel}}</button>
    </sc-if>
  </div>

  <sc-if value="{{exitOpen}}" hint-placeholder-val="{{false}}">
    <div class="dim" style="position: absolute; inset: 0; background: rgba(32,42,64,0.6); display: flex; align-items: center; justify-content: center; padding: 0 28px">
      <div class="popin" style="width: 100%; background: #FFFFFF; border-radius: 24px; padding: 26px 20px 18px; display: flex; flex-direction: column; align-items: center">
        <h2 style="margin: 0; font-size: 19px; font-weight: 900">설문을 그만할까요?</h2>
        <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.55; color: #545E73; text-align: center">지금 나가면 답한 내용이 저장되지 않고<br>10P도 받을 수 없어요.</p>
        <div style="margin-top: 20px; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <a href="Main.dc.html" style="height: 50px; border-radius: 14px; background: #EFF1F7; color: #545E73; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">나가기</a>
          <button onClick="{{stay}}" style="height: 50px; border: none; border-radius: 14px; background: #3157D5; color: #FFFFFF; font-size: 15px; font-weight: 700; font-family: inherit">계속하기</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { idx: 0, ans: {}, exit: false }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    var self = this, st = this.state;
    var Q = [
      { type: 'choice', title: '시험 기간에 카페에서 공부하는 횟수는?', hint: '하나만 골라 주세요', opts: ['거의 안 가요', '주 1~2회', '주 3~4회', '거의 매일'] },
      { type: 'scale', title: '카페에서 공부하면 집중이 더 잘 돼요', hint: '가장 가까운 정도를 골라 주세요', opts: ['1', '2', '3', '4', '5'] },
      { type: 'choice', title: '카페를 고를 때 가장 중요한 건?', hint: '하나만 골라 주세요', opts: ['콘센트·와이파이', '가격', '조용한 분위기', '학교와의 거리'] }
    ];
    var pick = function (qi, oi, auto) {
      return function () {
        var ans = Object.assign({}, self.state.ans); ans[qi] = oi;
        self.setState({ ans: ans });
        if (auto) { clearTimeout(self.t); self.t = setTimeout(function () { self.setState({ idx: qi + 1 }); }, 350); }
      };
    };
    var scaleNames = ['전혀 아니에요', '아닌 편이에요', '보통이에요', '그런 편이에요', '매우 그래요'];
    var qs = Q.map(function (q, qi) {
      return {
        n: qi + 1, title: q.title, hint: q.hint, current: qi === st.idx,
        isChoice: q.type === 'choice', isScale: q.type === 'scale',
        options: q.opts.map(function (label, oi) {
          var on = st.ans[qi] === oi;
          return { label: label, on: on, off: !on, aria: label + '점, ' + (scaleNames[oi] || ''), pick: pick(qi, oi, q.auto) };
        })
      };
    });
    var answered = st.ans[st.idx] !== undefined, last = st.idx === Q.length - 1;
    var segs = Q.map(function (q, i) {
      return { color: st.ans[i] !== undefined ? '#3157D5' : i === st.idx ? '#9FB2FF' : '#E3E9FF' };
    });
    return {
      qs: qs, segs: segs, num: st.idx + 1,
      hasPrev: st.idx > 0,
      canNext: answered && !last, canSubmit: answered && last, waiting: !answered,
      waitLabel: last ? '제출하고 10P 받기' : '다음',
      next: function () { self.setState({ idx: Math.min(st.idx + 1, Q.length - 1) }); },
      prev: function () { clearTimeout(self.t); self.setState({ idx: Math.max(st.idx - 1, 0) }); },
      exitOpen: st.exit,
      askExit: function () { self.setState({ exit: true }); },
      stay: function () { self.setState({ exit: false }); }
    };
  }
}
</script>
</body>
</html>
