<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설문 등록 2단계 – 문항</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3157D5}a:hover{color:#203A91}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sheet{animation:slideUp .35s cubic-bezier(.2,.8,.2,1) both}
.dim{animation:dimIn .2s ease-out both}
.open{animation:open .25s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1280px; box-sizing: border-box; background: #F7F8FC; font-family: Pretendard, -apple-system, 'Noto Sans KR', sans-serif; color: #202A40; position: relative; padding-top: 44px; overflow: hidden">

  <div style="background: #FFFFFF">
    <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
      <a href="Main.dc.html" aria-label="이전 단계" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#202A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 700">설문 등록</div>
      <button style="height: 44px; border: none; background: transparent; color: #3157D5; font-size: 14px; font-weight: 700; font-family: inherit; padding: 0 12px">임시저장</button>
    </div>
    <div style="padding: 10px 20px 0; display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <div style="height: 6px; border-radius: 999px; background: #3157D5"></div>
        <div style="height: 6px; border-radius: 999px; background: #3157D5"></div>
        <div style="height: 6px; border-radius: 999px; background: #E3E9FF"></div>
        <div style="height: 6px; border-radius: 999px; background: #E3E9FF"></div>
      </div>
      <span style="font-size: 14px; font-weight: 700; color: #545E73">2 / 4</span>
    </div>
    <div style="padding: 24px 20px 16px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 900">문항 만들기</h1>
      <div style="margin-top: 10px; display: flex; gap: 6px; font-size: 13px; line-height: 1.5; color: #545E73">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3157D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span>문항이 5개 이상이면 성실한 응답인지 확인하는 문항이 자동으로 1개 들어가요. 최대 30문항.</span>
      </div>
    </div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{qs}}" as="q" hint-placeholder-count="3">
      <sc-if value="{{q.closed}}" hint-placeholder-val="{{true}}">
        <button onClick="{{q.open}}" style="background: #FFFFFF; border: none; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: inherit; color: #202A40; width: 100%">
          <span style="font-size: 14px; font-weight: 900; color: #3157D5; width: 22px">Q{{q.n}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.title}}</span>
            <span style="font-size: 12px; color: #545E73">{{q.typeLabel}}</span>
          </span>
        </button>
      </sc-if>

      <sc-if value="{{q.isOpen}}" hint-placeholder-val="{{false}}">
        <div class="open" style="background: #FFFFFF; border: 2px solid #3157D5; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 14px; font-weight: 900; color: #3157D5">Q{{q.n}}</span>
            <button onClick="{{q.openSheet}}" style="height: 34px; border: none; border-radius: 999px; background: #EFF1F7; color: #374158; font-size: 13px; font-weight: 700; font-family: inherit; padding: 0 12px; display: flex; align-items: center; gap: 4px">{{q.typeLabel}} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#545E73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
            <span style="flex: 1"></span>
            <button aria-label="위로 옮기기" style="width: 36px; height: 36px; border: 1px solid #E2E5EE; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#545E73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
            <button aria-label="아래로 옮기기" style="width: 36px; height: 36px; border: 1px solid #E2E5EE; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CDD2DF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></button>
            <button aria-label="문항 복제" style="width: 36px; height: 36px; border: 1px solid #E2E5EE; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#545E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
            <button aria-label="문항 삭제" style="width: 36px; height: 36px; border: 1px solid #FDA29B; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #3157D5">
            <input value="{{q.title}}" aria-label="질문" style="flex: 1; min-width: 0; height: 48px; border: none; padding: 0 2px; font-size: 17px; font-weight: 700; font-family: inherit; color: #202A40; outline: none">
            <button aria-label="질문에 사진 넣기" style="width: 40px; height: 40px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3157D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg></button>
          </div>

          <sc-if value="{{q.isChoice}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <sc-for list="{{q.opts}}" as="o" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
                  <span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: {{q.mark}}; border: 2px solid #CDD2DF; flex-shrink: 0"></span>
                  <span style="flex: 1; font-size: 15px">{{o}}</span>
                </div>
              </sc-for>
              <button style="height: 44px; border: none; background: transparent; color: #3157D5; font-size: 14px; font-weight: 700; font-family: inherit; text-align: left; padding: 0 0 0 28px">+ 보기 추가</button>
              <div style="display: flex; gap: 6px; padding-left: 28px">
                <button style="height: 34px; border: 1px solid #E2E5EE; border-radius: 999px; background: #FFFFFF; color: #374158; font-size: 13px; font-family: inherit; padding: 0 12px">+ 해당 없음</button>
                <button style="height: 34px; border: 1px solid #E2E5EE; border-radius: 999px; background: #FFFFFF; color: #374158; font-size: 13px; font-family: inherit; padding: 0 12px">+ 기타 (직접 입력)</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{q.isPhoto}}" hint-placeholder-val="{{false}}">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{q.opts}}" as="o" hint-placeholder-count="4">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <div style="height: 96px; border-radius: 12px; background: #E3E9FF; display: flex; align-items: center; justify-content: center">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6F8BEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
                  </div>
                  <span style="font-size: 13px; text-align: center">{{o}}</span>
                </div>
              </sc-for>
              <button style="height: 96px; border: 1.5px dashed #C7D2FF; border-radius: 12px; background: #FFFFFF; color: #3157D5; font-size: 13px; font-weight: 700; font-family: inherit">+ 사진 추가</button>
            </div>
          </sc-if>

          <sc-if value="{{q.isScale}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
                <span style="height: 40px; border-radius: 10px; background: #EFF1F7; display: flex; align-items: center; justify-content: center; font-weight: 700">1</span>
                <span style="height: 40px; border-radius: 10px; background: #EFF1F7; display: flex; align-items: center; justify-content: center; font-weight: 700">2</span>
                <span style="height: 40px; border-radius: 10px; background: #EFF1F7; display: flex; align-items: center; justify-content: center; font-weight: 700">3</span>
                <span style="height: 40px; border-radius: 10px; background: #EFF1F7; display: flex; align-items: center; justify-content: center; font-weight: 700">4</span>
                <span style="height: 40px; border-radius: 10px; background: #EFF1F7; display: flex; align-items: center; justify-content: center; font-weight: 700">5</span>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 13px; color: #545E73"><span>전혀 아니에요</span><span>매우 그래요</span></div>
            </div>
          </sc-if>

          <sc-if value="{{q.isRank}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{q.opts}}" as="o" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; gap: 10px; height: 44px; background: #F7F8FC; border-radius: 10px; padding: 0 12px">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="#AEB5C5" aria-hidden="true"><rect x="4" y="6" width="16" height="2.5" rx="1"></rect><rect x="4" y="11" width="16" height="2.5" rx="1"></rect><rect x="4" y="16" width="16" height="2.5" rx="1"></rect></svg>
                  <span style="font-size: 15px">{{o}}</span>
                </div>
              </sc-for>
              <span style="font-size: 12px; color: #545E73">응답자가 끌어서 순서를 정해요</span>
            </div>
          </sc-if>

          <sc-if value="{{q.isText}}" hint-placeholder-val="{{false}}">
            <div style="height: 48px; border-radius: 12px; background: #F7F8FC; display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: #545E73">응답자가 직접 써요</div>
          </sc-if>

          <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #EFF1F7; padding-top: 10px">
            <button onClick="{{toggleMore}}" style="height: 36px; border: none; background: transparent; color: #545E73; font-size: 13px; font-family: inherit; padding: 0">{{moreLabel}}</button>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #374158">필수
              <span style="width: 40px; height: 24px; border-radius: 999px; background: #3157D5; position: relative; display: inline-block"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span>
            </span>
          </div>
          <sc-if value="{{showMore}}" hint-placeholder-val="{{false}}">
            <div class="open" style="display: flex; flex-direction: column; gap: 4px; font-size: 14px">
              <span style="display: flex; justify-content: space-between; min-height: 36px; align-items: center">보기 순서 섞기 <span style="color: #545E73">꺼짐</span></span>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>

    <button onClick="{{addQ}}" style="height: 54px; border: none; border-radius: 16px; background: #FFFFFF; color: #3157D5; font-size: 15px; font-weight: 700; font-family: inherit">+ 문항 추가</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EFF1F7; padding: 10px 16px 30px">
    <div style="text-align: center; font-size: 13px; color: #545E73; margin-bottom: 8px">{{count}}문항 · 약 1분 · 1명당 <b style="color: #202A40">15P</b></div>
    <a href="Target.dc.html" style="height: 56px; border-radius: 16px; background: #3157D5; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">다음</a>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button class="dim" onClick="{{closeSheet}}" aria-label="닫기" style="position: absolute; inset: 0; border: none; padding: 0; background: rgba(32,42,64,0.5)"></button>
    <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 16px 30px">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #CDD2DF; margin: 0 auto"></div>
      <div style="margin: 18px 4px 10px; font-size: 18px; font-weight: 900">답변 방식</div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="7">
          <button onClick="{{t.pick}}" style="min-height: 58px; border: none; border-radius: 14px; background: {{t.bg}}; display: flex; align-items: center; gap: 14px; padding: 0 12px; text-align: left; font-family: inherit; color: #202A40; width: 100%">
            <span style="width: 36px; height: 36px; border-radius: 10px; background: #E3E9FF; color: #2949B5; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{t.glyph}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 700">{{t.label}}
                <sc-if value="{{t.isNew}}" hint-placeholder-val="{{false}}"><span style="background: #A3EA16; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 999px; margin-left: 4px">NEW</span></sc-if>
              </span>
              <span style="font-size: 12px; color: #545E73">{{t.desc}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1280}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 2, sheet: false, more: false, qs: [
      { title: '시험 기간에 카페에서 공부하는 횟수는?', type: 'single', opts: ['거의 안 가요', '주 1~2회', '주 3~4회', '거의 매일'] },
      { title: '카페에서 공부하면 집중이 더 잘 돼요', type: 'scale', opts: [] },
      { title: '가장 가고 싶은 카페 분위기는?', type: 'photo', opts: ['아늑한 곳', '넓은 곳', '조용한 곳'] }
    ] };
  }
  renderVals() {
    var self = this, st = this.state;
    var TYPES = [
      { k: 'single', label: '하나 고르기', glyph: '○', desc: '보기 중 하나만 골라요' },
      { k: 'multi', label: '여러 개 고르기', glyph: '☐', desc: '해당하는 걸 모두 골라요' },
      { k: 'photo', label: '사진 고르기', glyph: '▦', desc: '사진 보기 중에서 골라요', isNew: true },
      { k: 'scale', label: '5점 척도', glyph: '1-5', desc: '얼마나 그런지 점수로 답해요' },
      { k: 'rank', label: '순위 매기기', glyph: '1·2', desc: '보기를 좋아하는 순서대로 놓아요', isNew: true },
      { k: 'short', label: '짧은 주관식', glyph: '가', desc: '한 줄로 직접 써요' },
      { k: 'long', label: '긴 주관식', glyph: '가…', desc: '여러 줄로 자유롭게 써요' }
    ];
    var label = function (k) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i].k === k) return TYPES[i].label; return ''; };
    var qs = st.qs.map(function (q, i) {
      var opts = q.opts.length ? q.opts : ['보기 1', '보기 2', '보기 3'];
      return {
        n: i + 1, title: q.title, typeLabel: label(q.type),
        isOpen: st.open === i, closed: st.open !== i,
        open: function () { self.setState({ open: i, more: false }); },
        openSheet: function () { self.setState({ sheet: true }); },
        isChoice: q.type === 'single' || q.type === 'multi', mark: q.type === 'multi' ? '5px' : '50%',
        isPhoto: q.type === 'photo', isScale: q.type === 'scale', isRank: q.type === 'rank',
        isText: q.type === 'short' || q.type === 'long', opts: opts
      };
    });
    var cur = st.qs[st.open] || {};
    var types = TYPES.map(function (t) {
      return { label: t.label, glyph: t.glyph, desc: t.desc, isNew: !!t.isNew, bg: cur.type === t.k ? '#F1F4FF' : 'transparent',
        pick: function () {
          var list = self.state.qs.slice(); list[self.state.open] = Object.assign({}, list[self.state.open], { type: t.k });
          self.setState({ qs: list, sheet: false });
        } };
    });
    return {
      qs: qs, count: st.qs.length, types: types, sheetOpen: st.sheet,
      closeSheet: function () { self.setState({ sheet: false }); },
      showMore: st.more, moreLabel: st.more ? '옵션 접기' : '옵션 더보기',
      toggleMore: function () { self.setState({ more: !self.state.more }); },
      addQ: function () {
        var list = self.state.qs.concat([{ title: '', type: 'single', opts: [] }]);
        self.setState({ qs: list, open: list.length - 1, sheet: true });
      }
    };
  }
}
</script>
</body>
</html>
